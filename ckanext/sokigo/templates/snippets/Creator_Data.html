{% asset 'sokigo/sokigo_js' %}
 
<div class="form-group control-medium control-select">
	<label class="form-label" for="field-creator_name">{{ _("Informationsägare") }}</label>
	<div class="controls">
		<select id="field-creator_name" name="creator_name" class="form-control form-select">
			<option value=""/>
				 {% set existing_source_id = data.get('creator_name') %}
                {% for producer in h.get_producer_from_json(data) %}
			<option value="{{ producer['value'] }}" 
			data-uri="{{producer['uri'] }}"
                            data-email="{{ producer['email'] }}"
                            data-type="{{producer['type'] }}"
                            data-url="{{producer['url'] }}"
			{% if existing_source_id==producer['value' ] %}selected="selected" {% endif %}>{{ producer['label']|safe }} </option> {% endfor %}
		</select>
		<div class="info-block ">
               <i class="fa fa-info-circle"></i><font _mstmutation="1">
                 Enhet (organisation) som är huvudansvarig för att producera datamängden.
                 </font></div>
              {% if error %}		<span class="error-block">{{ error }}</span>{% endif %}
	</div>

</div>	
  <style>
/* Style for the details box */
.details-box {
    border: 1px solid #ccc;
    padding: 10px;
    margin-top: 10px;
    border-radius: 4px;
}

.info-block {
    position: relative;
    display: block;
    font-size: 11px;
    color: #6e6e6e;
    line-height: 1.3;
    margin-top: 6px;
}
  </style>
